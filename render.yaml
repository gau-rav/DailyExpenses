services:
  - type: web
    name: dailyexpenses
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_GMAIL_CLIENT_ID
        sync: false
      - key: GOOGLE_GMAIL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_GMAIL_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_SYNC_SECRET
        sync: false
      - key: GMAIL_INITIAL_LOOKBACK_DAYS
        value: "7"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: penny_expenses
  - type: cron
    name: dailyexpenses-gmail-sync
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: npm install --include=dev
    startCommand: node server/gmailCron.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: penny_expenses
      - key: GOOGLE_GMAIL_CLIENT_ID
        sync: false
      - key: GOOGLE_GMAIL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_GMAIL_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_INITIAL_LOOKBACK_DAYS
        value: "7"
